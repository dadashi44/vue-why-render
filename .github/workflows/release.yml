name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: write
    id-token: write

jobs:
    publish:
        name: publish to npm
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - run: npm ci

            # Расхождение тега и версии в package.json — самая частая причина
            # «опубликовали не то», поэтому падаем до публикации.
            - name: Tag must match package version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG="$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$PKG" ]; then
                    echo "Тег $GITHUB_REF_NAME не совпадает с версией $PKG в package.json"
                    exit 1
                  fi

            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

            - name: Publish
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
