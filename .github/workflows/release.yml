name: Release

on:
    push:
        tags: ['v*']

# id-token нужен для доверенной публикации: npm обменивает
# OIDC-токен Actions на одноразовые права на публикацию.
permissions:
    contents: write
    id-token: write

jobs:
    publish:
        name: publish to npm
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            # Доверенная публикация умеет работать с npm 11.5.1 и новее,
            # а с node 22 приезжает npm 10 — обновляем явно.
            - name: Update npm
              run: npm install -g npm@latest

            - run: npm ci

            # Расхождение тега и версии в package.json — самая частая причина
            # «опубликовали не то», поэтому падаем до публикации.
            - name: Tag must match package version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG="$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$PKG" ]; then
                    echo "Тег $GITHUB_REF_NAME не совпадает с версией $PKG в package.json"
                    exit 1
                  fi

            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

            # Токен не нужен и не задаётся: npm видит OIDC-окружение Actions
            # и публикует по доверию, сам проставляя провенанс. Если доверие
            # на стороне npm не настроено, шаг падает — и это правильно:
            # раньше публикация молча пропускалась, и четыре релиза подряд
            # никуда не уехали.
            - name: Publish to npm
              run: npm publish --access public

            - name: Pack tarball
              run: echo "TARBALL=$(npm pack --silent)" >> "$GITHUB_ENV"

            - name: GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  generate_release_notes: true
                  files: ${{ env.TARBALL }}
