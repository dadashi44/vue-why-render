name: Site

on:
    push:
        branches: [main]
    workflow_dispatch:

# Нужны для деплоя на Pages: чтение кода, запись страницы, OIDC-токен.
permissions:
    contents: read
    pages: write
    id-token: write

# Параллельные деплои перетирали бы друг друга, но уже начатый прерывать
# не стоит — дождёмся и выложим следующий.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: build site
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - uses: actions/configure-pages@v6
              id: pages

            # base берём из настроек Pages: на github.io это /vue-why-render/,
            # а на своём домене — корень. Хардкод здесь ломался бы при переезде.
            - name: Build
              run: npm run build:site
              env:
                  SITE_BASE: ${{ steps.pages.outputs.base_path }}/

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist-site

    deploy:
        name: deploy
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v5
              id: deployment
