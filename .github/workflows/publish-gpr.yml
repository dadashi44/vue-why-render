name: Publish to GitHub Packages

on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    publish:
        name: publish to GitHub Packages
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://npm.pkg.github.com
                  scope: '@dadashi44'

            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

            # GitHub Packages принимает только имена вида @владелец/пакет.
            # В npm пакет уедет без области, поэтому имя правим на лету
            # и коммитить эту правку не надо.
            - name: Scope the package name for this registry
              run: npm pkg set name="@dadashi44/vue-why-render"

            - name: Publish
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
