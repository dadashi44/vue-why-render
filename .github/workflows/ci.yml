name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: lint + types + tests (node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22, 24]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Tests
              run: npm run test:coverage

            - name: Build
              run: npm run build

            # packages/mcp ставит свои зависимости отдельно от корня.
            - name: Install MCP package
              run: npm ci --prefix packages/mcp

            - name: MCP typecheck
              run: npx tsc --noEmit -p packages/mcp

            - name: MCP tests
              run: npm run test:mcp

            - name: Upload coverage
              if: matrix.node == 22
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: coverage
                  retention-days: 7

    e2e:
        name: e2e (playwright)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            # Только Chromium: e2e проверяют то, чего не видит jsdom, —
            # раскладку, клавиатуру, буфер обмена, — а не различия браузеров.
            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: e2e
              run: npm run test:e2e

            - name: Upload report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7

    docs:
        name: docs site
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      docs-site/package-lock.json

            - run: npm ci

            # Документация собирается поверх лендинга, поэтому лендинг первым.
            - name: Build landing
              run: npm run build:site

            - name: Install docs dependencies
              run: npm ci --prefix docs-site

            - name: Build docs
              run: npm run docs:build

            - name: Test docs build
              run: npm run docs:test

            # Тот же набор под base github.io: ссылки в содержимом должны
            # получить префикс, иначе валидатор ссылок валит сборку.
            - name: Build landing (github.io base)
              run: npm run build:site
              env:
                  SITE_BASE: /vue-why-render/

            - name: Build docs (github.io base)
              run: npm run docs:build
              env:
                  SITE_BASE: /vue-why-render/

            - name: Test docs build (github.io base)
              run: npm run docs:test
              env:
                  SITE_BASE: /vue-why-render/

    package-managers:
        name: ${{ matrix.manager }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                manager: [pnpm, yarn, bun]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Setup pnpm
              if: matrix.manager == 'pnpm'
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Setup bun
              if: matrix.manager == 'bun'
              uses: oven-sh/setup-bun@v2

            # Лок-файл в репозитории только npm-овский, поэтому остальные
            # менеджеры ставят зависимости по package.json «с нуля».
            - name: Install
              run: |
                  case "${{ matrix.manager }}" in
                    pnpm) pnpm install --no-frozen-lockfile ;;
                    yarn)
                      corepack enable
                      yarn set version stable
                      # По умолчанию yarn 4 включает PnP, в котором не резолвятся
                      # ни vitest, ни голый node. Пользователи в подавляющем
                      # большинстве сидят на node-modules — его и проверяем.
                      yarn config set nodeLinker node-modules
                      yarn install --no-immutable
                      ;;
                    bun)  bun install ;;
                  esac

            - name: Tests
              run: ${{ matrix.manager }} run test

            - name: Build
              run: ${{ matrix.manager }} run build

    install-matrix:
        name: install from tarball (${{ matrix.manager }})
        runs-on: ubuntu-latest
        needs: quality
        strategy:
            fail-fast: false
            matrix:
                manager: [npm, pnpm, yarn, bun]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Setup pnpm
              if: matrix.manager == 'pnpm'
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Setup bun
              if: matrix.manager == 'bun'
              uses: oven-sh/setup-bun@v2

            - run: npm ci
            - run: npm run build

            - name: Pack
              run: echo "TARBALL=$(npm pack --silent)" >> "$GITHUB_ENV"

            # Ставим собранный тарбол в пустой проект тем же способом,
            # которым его поставит пользователь, и проверяем, что импорт живой.
            - name: Install tarball into a clean project
              run: |
                  mkdir -p /tmp/consumer && cd /tmp/consumer
                  npm init -y > /dev/null
                  case "${{ matrix.manager }}" in
                    npm)  npm install vue "$GITHUB_WORKSPACE/$TARBALL" ;;
                    pnpm) pnpm add vue "$GITHUB_WORKSPACE/$TARBALL" ;;
                    yarn)
                      corepack enable
                      yarn set version stable
                      yarn config set nodeLinker node-modules
                      yarn add vue "$GITHUB_WORKSPACE/$TARBALL"
                      ;;
                    bun)  bun add vue "$GITHUB_WORKSPACE/$TARBALL" ;;
                  esac

            - name: Smoke test the published entry points
              run: |
                  cd /tmp/consumer
                  node --input-type=module -e "
                    import plugin, { Registry, resolveOptions } from 'vue-why-render'
                    if (typeof plugin.install !== 'function') throw new Error('нет install()')
                    if (resolveOptions({ enabled: true }).enabled !== true) throw new Error('опции сломаны')
                    new Registry().register({ uid: 1, name: 'X', parentUid: null })
                    console.log('ESM ok')
                  "
                  node -e "
                    const lib = require('vue-why-render')
                    if (typeof lib.scan !== 'function') throw new Error('нет scan()')
                    console.log('CJS ok')
                  "
